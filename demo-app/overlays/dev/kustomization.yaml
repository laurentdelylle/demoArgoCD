namespace: demo-dev
resources:
  - ../../base
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.1
replicas:
  - name: demo-app
    count: 1
configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - PODINFO_UI_MESSAGE=Environnement DEV
      - PODINFO_UI_COLOR=#2e86de
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 9898
  - target:
      kind: Service
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8081
      - op: replace
        path: /spec/ports/0/targetPort
        value: 9898
