apiVersion: apps/v1
kind: Deployment
metadata: {name: mariadb}
spec:
  replicas: 1
  selector: {matchLabels: {app: mariadb}}
  template:
    metadata: {labels: {app: mariadb}}
    spec:
      containers:
      - name: mariadb
        image: mariadb:11
        env:
          - {name: MARIADB_DATABASE, value: wp}
          - {name: MARIADB_USER, value: wp}
          - name: MARIADB_PASSWORD
            valueFrom: {secretKeyRef: {name: db, key: password}}
          - name: MARIADB_ROOT_PASSWORD
            valueFrom: {secretKeyRef: {name: db, key: password}}
--- 
apiVersion: v1
kind: Service
metadata: {name: mariadb}
spec:
  selector: {app: mariadb}
  ports: [{port: 3306}]
