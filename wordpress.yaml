apiVersion: v1
kind: Deployment
metadata:
  name: wordpress
replicas: 1
selector: {matchLabels: {app: wordpress}}
template:
  metadata: {labels: {apps: mariadb}}
  spec:
  containers:
  - name: wordpress
    image: wordpress:6-apache
    env:
          - {name: WORDPRESS_DB_HOST, value: mariadb}
          - {name: WORDPRESS_DB_NAME, value: wp}
          - {name: WORDPRESS_DB_USER, value: wp}
          - name: WORDPRESS_DB_PASSWORD
            valueFrom: {secretKeyRef: {name: db, key: password}}
---
apiVersion: v1
kind: Service
metadata: {name: wordpress}
spec:
  selector: {app: wordpress}
  ports: [{port: 80}]
